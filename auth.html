<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIL — Secure Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── tokens ─────────────────────────────────────────────────────────── */
    :root {
      --bg:        #080c0f;
      --surface:   #0d1318;
      --border:    #1c2830;
      --border-hi: #2e4052;
      --text:      #c8d8e4;
      --muted:     #4a6070;
      --accent:    #00e5ff;
      --accent-dim:#004d5a;
      --danger:    #ff3b5c;
      --ok:        #00e5a0;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Syne', sans-serif;
      --r:         6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      /* subtle scanline texture */
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,229,255,.018) 2px,
          rgba(0,229,255,.018) 3px
        );
    }

    /* ── grid noise overlay ─────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,229,255,.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── layout ─────────────────────────────────────────────────────────── */
    .shell {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
    }

    /* ── header ─────────────────────────────────────────────────────────── */
    .brand {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 2.5rem;
    }
    .brand-logo {
      width: 38px; height: 38px;
      border: 1.5px solid var(--accent);
      border-radius: 4px;
      display: grid; place-items: center;
      box-shadow: 0 0 12px rgba(0,229,255,.25), inset 0 0 8px rgba(0,229,255,.08);
    }
    .brand-logo svg { width: 20px; height: 20px; }
    .brand-name {
      font-size: 1.25rem; font-weight: 800; letter-spacing: .12em;
      color: var(--accent); text-transform: uppercase;
    }
    .brand-sub {
      font-family: var(--mono); font-size: .65rem;
      color: var(--muted); letter-spacing: .08em; margin-top: .1rem;
    }

    /* ── card ───────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 2rem;
      box-shadow: 0 0 0 1px rgba(0,229,255,.04), 0 24px 48px rgba(0,0,0,.5);
    }

    /* ── tab switcher ───────────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }
    .tab {
      flex: 1; padding: .6rem 0;
      background: none; border: none; cursor: pointer;
      font-family: var(--mono); font-size: .75rem; letter-spacing: .1em;
      color: var(--muted); text-transform: uppercase;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .2s, border-color .2s;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── form ───────────────────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-family: var(--mono); font-size: .65rem; letter-spacing: .1em;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: .45rem;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: .65rem .85rem;
      color: var(--text);
      font-family: var(--mono); font-size: .9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,255,.1);
    }
    .field input::placeholder { color: var(--muted); }

    /* ── button ─────────────────────────────────────────────────────────── */
    .btn {
      width: 100%; padding: .75rem;
      background: var(--accent);
      color: #000;
      font-family: var(--sans); font-weight: 700; font-size: .85rem;
      letter-spacing: .1em; text-transform: uppercase;
      border: none; border-radius: var(--r);
      cursor: pointer;
      margin-top: .5rem;
      transition: opacity .15s, box-shadow .15s;
      box-shadow: 0 0 20px rgba(0,229,255,.2);
    }
    .btn:hover { opacity: .88; box-shadow: 0 0 28px rgba(0,229,255,.35); }
    .btn:active { opacity: .75; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      box-shadow: none;
      margin-top: 1rem;
    }
    .btn.danger:hover { background: rgba(255,59,92,.08); }

    /* ── flash message ──────────────────────────────────────────────────── */
    .flash {
      font-family: var(--mono); font-size: .75rem;
      padding: .65rem .85rem;
      border-radius: var(--r);
      margin-bottom: 1rem;
      display: none;
    }
    .flash.err  { background: rgba(255,59,92,.1);  color: var(--danger); border: 1px solid rgba(255,59,92,.3); }
    .flash.ok   { background: rgba(0,229,160,.08); color: var(--ok);     border: 1px solid rgba(0,229,160,.25); }
    .flash.show { display: block; animation: fadeIn .2s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    /* ── identity card (post-login) ─────────────────────────────────────── */
    #identity { display: none; }
    #identity.visible { display: block; }

    .id-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: grid; place-items: center;
      font-size: 1.4rem; font-weight: 800; color: var(--accent);
      font-family: var(--sans);
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(0,229,255,.2);
    }
    .id-name {
      font-size: 1.2rem; font-weight: 700; color: #fff;
      line-height: 1.2;
    }
    .id-role {
      font-family: var(--mono); font-size: .65rem; letter-spacing: .12em;
      color: var(--muted); text-transform: uppercase;
      margin-top: .25rem;
    }

    .id-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: .75rem; margin-bottom: 1.5rem;
    }
    .id-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: .75rem .9rem;
    }
    .id-cell-label {
      font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
      color: var(--muted); text-transform: uppercase; margin-bottom: .3rem;
    }
    .id-cell-value {
      font-family: var(--mono); font-size: .85rem; color: var(--text);
      word-break: break-all;
    }
    .id-cell-value.accent { color: var(--accent); }
    .id-cell-value.ok     { color: var(--ok); }

    /* role badge */
    .role-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      font-family: var(--mono); font-size: .7rem; letter-spacing: .08em;
      padding: .25rem .6rem; border-radius: 3px;
      text-transform: uppercase;
    }
    .role-badge.analyst { background: rgba(0,229,255,.08); color: var(--accent); border: 1px solid var(--accent-dim); }
    .role-badge.admin   { background: rgba(255,200,0,.08);  color: #ffc800;       border: 1px solid rgba(255,200,0,.3); }
    .role-badge::before { content: '●'; font-size: .5rem; }

    /* token preview */
    .token-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: .75rem .9rem;
      margin-bottom: 1rem;
    }
    .token-preview-label {
      font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
      color: var(--muted); text-transform: uppercase; margin-bottom: .4rem;
    }
    .token-preview-value {
      font-family: var(--mono); font-size: .68rem; color: var(--muted);
      word-break: break-all; line-height: 1.6;
    }
    .token-preview-value span { color: var(--accent); }

    /* copy button */
    .copy-btn {
      font-family: var(--mono); font-size: .65rem; letter-spacing: .08em;
      color: var(--muted); background: none; border: none; cursor: pointer;
      float: right; text-transform: uppercase;
      transition: color .15s;
    }
    .copy-btn:hover { color: var(--accent); }

    /* divider */
    .divider {
      height: 1px; background: var(--border);
      margin: 1.25rem 0;
    }

    /* ── API base notice ────────────────────────────────────────────────── */
    .api-notice {
      font-family: var(--mono); font-size: .65rem;
      color: var(--muted); text-align: center;
      margin-top: 1.5rem;
      letter-spacing: .04em;
    }
    .api-notice span { color: var(--accent); }

    /* loading spinner inline */
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="shell">

  <!-- brand -->
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="3" fill="#00e5ff"/>
        <circle cx="10" cy="10" r="6.5" stroke="#00e5ff" stroke-width="1" opacity=".4"/>
        <circle cx="10" cy="10" r="9.5" stroke="#00e5ff" stroke-width=".6" opacity=".2"/>
        <line x1="10" y1="0" x2="10" y2="4" stroke="#00e5ff" stroke-width="1"/>
        <line x1="10" y1="16" x2="10" y2="20" stroke="#00e5ff" stroke-width="1"/>
        <line x1="0" y1="10" x2="4" y2="10" stroke="#00e5ff" stroke-width="1"/>
        <line x1="16" y1="10" x2="20" y2="10" stroke="#00e5ff" stroke-width="1"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">OIL</div>
      <div class="brand-sub">Open Intelligence Lab · Secure Access</div>
    </div>
  </div>

  <!-- card -->
  <div class="card">

    <!-- AUTH FORMS (shown when logged out) -->
    <div id="auth-forms">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign In</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <div id="flash" class="flash"></div>

      <!-- LOGIN -->
      <div id="panel-login" class="panel active">
        <div class="field">
          <label>Username</label>
          <input id="login-username" type="text" placeholder="your username" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn" id="btn-login" onclick="doLogin()">Sign In</button>
      </div>

      <!-- REGISTER -->
      <div id="panel-register" class="panel">
        <div class="field">
          <label>Full Name</label>
          <input id="reg-fullname" type="text" placeholder="First Last" autocomplete="name" />
        </div>
        <div class="field">
          <label>Username</label>
          <input id="reg-username" type="text" placeholder="lowercase, no spaces" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password <span style="color:var(--muted);font-size:.6rem">min 8 chars</span></label>
          <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button class="btn" id="btn-register" onclick="doRegister()">Create Account</button>
      </div>
    </div>

    <!-- IDENTITY PANEL (shown when logged in) -->
    <div id="identity">
      <div class="id-header">
        <div class="avatar" id="id-avatar">?</div>
        <div>
          <div class="id-name" id="id-name">—</div>
          <div class="id-role" id="id-role-label">—</div>
        </div>
      </div>

      <div class="id-grid">
        <div class="id-cell">
          <div class="id-cell-label">Username</div>
          <div class="id-cell-value accent" id="id-username">—</div>
        </div>
        <div class="id-cell">
          <div class="id-cell-label">Role</div>
          <div class="id-cell-value" id="id-role-badge">—</div>
        </div>
        <div class="id-cell">
          <div class="id-cell-label">Token expires</div>
          <div class="id-cell-value ok" id="id-exp">—</div>
        </div>
        <div class="id-cell">
          <div class="id-cell-label">Issued at</div>
          <div class="id-cell-value" id="id-iat">—</div>
        </div>
      </div>

      <div class="token-preview">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">
          <div class="token-preview-label">Bearer Token</div>
          <button class="copy-btn" onclick="copyToken()">Copy</button>
        </div>
        <div class="token-preview-value" id="id-token-preview">—</div>
      </div>

      <button class="btn danger" onclick="doLogout()">Sign Out</button>
    </div>

  </div>

  <div class="api-notice">
    API endpoint: <span id="api-url-display">—</span>
  </div>

</div>

<script>
  // ── CONFIG — point this at the Fly.io app ──────────────────────────────
  const API_BASE = (window.OIL_API_BASE || 'https://open-intelligence-lab.fly.dev').replace(/\/$/, '');

  document.getElementById('api-url-display').textContent = API_BASE;

  // ── Storage keys ─────────────────────────────────────────────────────────
  const KEYS = { token: 'oil_token', user: 'oil_user' };

  // ── Helpers ───────────────────────────────────────────────────────────────

  function flash(msg, type = 'err') {
    const el = document.getElementById('flash');
    el.textContent = msg;
    el.className = `flash ${type} show`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 5000);
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn._orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>Working…';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn._orig || btn.textContent;
      btn.disabled = false;
    }
  }

  function parseJWT(token) {
    try {
      const payload = token.split('.')[1];
      const padded = payload + '==='.slice((payload.length + 3) % 4);
      return JSON.parse(atob(padded.replace(/-/g, '+').replace(/_/g, '/')));
    } catch { return null; }
  }

  function fmtTime(unix) {
    return new Date(unix * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function tokenPreview(token) {
    const parts = token.split('.');
    return `<span>${parts[0].slice(0,12)}…</span>.<span>${parts[1].slice(0,16)}…</span>.${parts[2].slice(0,12)}…`;
  }

  // ── Tab switching ─────────────────────────────────────────────────────────

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    document.getElementById('flash').classList.remove('show');
  }

  // ── Show identity panel ───────────────────────────────────────────────────

  function showIdentity(token, fullName) {
    const claims = parseJWT(token);
    if (!claims) { doLogout(); return; }

    const name = fullName || claims.sub;
    const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const role = claims.role || 'analyst';

    document.getElementById('id-avatar').textContent = initials;
    document.getElementById('id-name').textContent = name;
    document.getElementById('id-role-label').textContent = `${role.toUpperCase()} · OIL Platform`;
    document.getElementById('id-username').textContent = claims.sub;
    document.getElementById('id-role-badge').innerHTML =
      `<span class="role-badge ${role}">${role}</span>`;
    document.getElementById('id-exp').textContent = claims.exp ? fmtTime(claims.exp) : '—';
    document.getElementById('id-iat').textContent = claims.iat ? fmtTime(claims.iat) : '—';
    document.getElementById('id-token-preview').innerHTML = tokenPreview(token);

    document.getElementById('auth-forms').style.display = 'none';
    document.getElementById('identity').classList.add('visible');
  }

  // ── Login ─────────────────────────────────────────────────────────────────

  async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { flash('Username and password are required.'); return; }

    setLoading('btn-login', true);
    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { flash(data.detail || 'Login failed.'); return; }

      const token = data.access_token;
      // Retrieve stored full name if we have it
      const storedUser = JSON.parse(localStorage.getItem(KEYS.user) || '{}');
      const fullName = (storedUser.username === username ? storedUser.fullName : null) || username;

      localStorage.setItem(KEYS.token, token);
      showIdentity(token, fullName);
    } catch (e) {
      flash(`Cannot reach API (${e.message}). Check your connection.`);
    } finally {
      setLoading('btn-login', false);
    }
  }

  // ── Register ──────────────────────────────────────────────────────────────

  async function doRegister() {
    const fullName = document.getElementById('reg-fullname').value.trim();
    const username = document.getElementById('reg-username').value.trim().toLowerCase();
    const password = document.getElementById('reg-password').value;

    if (!fullName)   { flash('Full name is required.'); return; }
    if (!username)   { flash('Username is required.'); return; }
    if (password.length < 8) { flash('Password must be at least 8 characters.'); return; }

    setLoading('btn-register', true);
    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { flash(data.detail || 'Registration failed.'); return; }

      // Store full name locally so the identity card can show it
      localStorage.setItem(KEYS.user, JSON.stringify({ username, fullName }));

      // Auto-login after registration
      const loginRes = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const loginData = await loginRes.json();
      if (!loginRes.ok) {
        flash('Account created — please sign in.', 'ok');
        switchTab('login');
        return;
      }
      localStorage.setItem(KEYS.token, loginData.access_token);
      showIdentity(loginData.access_token, fullName);
    } catch (e) {
      flash(`Cannot reach API (${e.message}). Check your connection.`);
    } finally {
      setLoading('btn-register', false);
    }
  }

  // ── Logout ────────────────────────────────────────────────────────────────

  function doLogout() {
    localStorage.removeItem(KEYS.token);
    document.getElementById('identity').classList.remove('visible');
    document.getElementById('auth-forms').style.display = '';
    document.getElementById('login-password').value = '';
  }

  // ── Copy token ────────────────────────────────────────────────────────────

  function copyToken() {
    const token = localStorage.getItem(KEYS.token);
    if (!token) return;
    navigator.clipboard.writeText(token).then(() => {
      const btn = document.querySelector('.copy-btn');
      const orig = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => btn.textContent = orig, 1500);
    });
  }

  // ── Enter key support ─────────────────────────────────────────────────────

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginPanel = document.getElementById('panel-login');
    const regPanel   = document.getElementById('panel-register');
    if (loginPanel.classList.contains('active')) doLogin();
    else if (regPanel.classList.contains('active')) doRegister();
  });

  // ── Resume session on load ────────────────────────────────────────────────

  (function init() {
    const token = localStorage.getItem(KEYS.token);
    if (!token) return;
    const claims = parseJWT(token);
    if (!claims || claims.exp < Date.now() / 1000) {
      localStorage.removeItem(KEYS.token);
      return;
    }
    const stored = JSON.parse(localStorage.getItem(KEYS.user) || '{}');
    const fullName = stored.username === claims.sub ? stored.fullName : null;
    showIdentity(token, fullName);
  })();
</script>
</body>
</html>
