<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OIL — Secure Access</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050810;--bg2:#0a0f1c;--bg3:#0f1628;
  --panel:#111827;--panel2:#162035;
  --border:#1e2d4a;--border2:#243458;
  --accent:#00d4ff;--accent2:#0084cc;--accent-dim:#003d5c;
  --green:#00e5a0;--amber:#f5a623;--red:#ff4444;--purple:#a855f7;
  --text:#c8d8f0;--text2:#7a92b8;--text3:#4a6080;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans)}

body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1rem;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -5%,rgba(0,212,255,.07) 0%,transparent 65%),
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.012) 2px,rgba(0,212,255,.012) 3px);
}

.shell{width:100%;max-width:480px;position:relative}

.brand{display:flex;align-items:center;gap:.85rem;margin-bottom:2.25rem}
.brand-icon{
  width:42px;height:42px;border:1.5px solid var(--accent);border-radius:5px;
  display:grid;place-items:center;
  box-shadow:0 0 18px rgba(0,212,255,.2),inset 0 0 10px rgba(0,212,255,.07)
}
.brand-name{font-size:1.2rem;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.brand-sub{font-family:var(--mono);font-size:.62rem;color:var(--text3);letter-spacing:.07em;margin-top:.15rem}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:1.85rem;
  box-shadow:0 0 0 1px rgba(0,212,255,.03),0 28px 56px rgba(0,0,0,.55)
}

.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.6rem}
.tab{
  flex:1;padding:.55rem 0;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;
  color:var(--text3);text-transform:uppercase;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text2)}

.panel{display:none}.panel.active{display:block}

.field{margin-bottom:1rem}
.field label{
  display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;
  color:var(--text3);text-transform:uppercase;margin-bottom:.4rem
}
.field input{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);
  padding:.6rem .8rem;color:var(--text);font-family:var(--mono);font-size:.88rem;
  outline:none;transition:border-color .2s,box-shadow .2s
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.09)}
.field input::placeholder{color:var(--text3)}

.btn{
  width:100%;padding:.72rem;margin-top:.4rem;
  background:var(--accent);color:#000;
  font-family:var(--sans);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;
  border:none;border-radius:var(--r);cursor:pointer;
  transition:opacity .15s,box-shadow .15s;
  box-shadow:0 0 22px rgba(0,212,255,.18)
}
.btn:hover{opacity:.87;box-shadow:0 0 32px rgba(0,212,255,.32)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{
  background:transparent;color:var(--red);border:1px solid var(--red);
  box-shadow:none;margin-top:.9rem
}
.btn.ghost:hover{background:rgba(255,68,68,.07)}
.btn.sm{
  width:auto;padding:.35rem .85rem;font-size:.72rem;margin-top:0;
  box-shadow:none
}
.btn.amber{background:var(--amber)}
.btn.danger-sm{
  background:transparent;color:var(--red);border:1px solid rgba(255,68,68,.4);
  font-family:var(--mono);font-size:.65rem;padding:.28rem .65rem;
  margin-top:0;width:auto;border-radius:3px;box-shadow:none
}
.btn.danger-sm:hover{background:rgba(255,68,68,.1)}

.flash{
  font-family:var(--mono);font-size:.73rem;padding:.6rem .8rem;
  border-radius:var(--r);margin-bottom:.9rem;display:none
}
.flash.err {background:rgba(255,68,68,.09); color:var(--red);   border:1px solid rgba(255,68,68,.28)}
.flash.ok  {background:rgba(0,229,160,.07); color:var(--green); border:1px solid rgba(0,229,160,.22)}
.flash.show{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

.spin{
  display:inline-block;width:11px;height:11px;
  border:2px solid rgba(0,0,0,.25);border-top-color:#000;
  border-radius:50%;animation:sp .55s linear infinite;
  vertical-align:middle;margin-right:5px
}
@keyframes sp{to{transform:rotate(360deg)}}

#identity{display:none}
#identity.on{display:block}

.id-top{display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem}
.avatar{
  width:54px;height:54px;border-radius:50%;flex-shrink:0;
  background:var(--accent-dim);border:2px solid var(--accent);
  display:grid;place-items:center;
  font-size:1.35rem;font-weight:700;color:var(--accent);
  box-shadow:0 0 18px rgba(0,212,255,.18)
}
.id-name{font-size:1.15rem;font-weight:700;color:#fff;line-height:1.2}
.id-sub{font-family:var(--mono);font-size:.62rem;color:var(--text3);text-transform:uppercase;margin-top:.22rem}

.badge{
  display:inline-flex;align-items:center;gap:.35rem;
  font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;
  padding:.22rem .55rem;border-radius:3px;text-transform:uppercase
}
.badge::before{content:'●';font-size:.45rem}
.badge.analyst{background:rgba(0,212,255,.08);color:var(--accent);border:1px solid var(--accent-dim)}
.badge.admin  {background:rgba(245,166,35,.08);color:var(--amber);border:1px solid rgba(245,166,35,.28)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1.2rem}
.cell{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem}
.cell-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:.28rem}
.cell-value{font-family:var(--mono);font-size:.82rem;color:var(--text);word-break:break-all}
.cell-value.accent{color:var(--accent)}
.cell-value.green {color:var(--green)}

.token-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem;margin-bottom:1rem}
.token-box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}
.token-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase}
.copy-btn{font-family:var(--mono);font-size:.62rem;color:var(--text3);background:none;border:none;cursor:pointer;letter-spacing:.07em;text-transform:uppercase;transition:color .15s}
.copy-btn:hover{color:var(--accent)}
.token-val{font-family:var(--mono);font-size:.65rem;color:var(--text3);word-break:break-all;line-height:1.65}
.token-val span{color:var(--accent)}

.divider{height:1px;background:var(--border);margin:1.1rem 0}

#admin-panel{display:none}
#admin-panel.on{display:block}

.section-title{
  font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
  color:var(--text3);text-transform:uppercase;
  margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)
}

.user-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:1.2rem}
.user-table th{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;
  color:var(--text3);text-transform:uppercase;text-align:left;
  padding:.5rem .6rem;border-bottom:1px solid var(--border)
}
.user-table td{padding:.55rem .6rem;border-bottom:1px solid rgba(30,45,74,.4);vertical-align:middle}
.user-table tr:last-child td{border-bottom:none}
.user-table tr:hover td{background:var(--panel2)}

.locked-badge{
  font-family:var(--mono);font-size:.6rem;padding:.18rem .45rem;
  background:rgba(255,68,68,.1);color:var(--red);border:1px solid rgba(255,68,68,.3);border-radius:3px
}
.ok-badge{
  font-family:var(--mono);font-size:.6rem;padding:.18rem .45rem;
  background:rgba(0,229,160,.07);color:var(--green);border:1px solid rgba(0,229,160,.22);border-radius:3px
}

.audit-list{display:flex;flex-direction:column;gap:.45rem;max-height:260px;overflow-y:auto}
.audit-list::-webkit-scrollbar{width:3px}
.audit-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.audit-row{
  display:grid;grid-template-columns:auto 1fr auto auto;gap:.5rem;align-items:center;
  background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:.45rem .7rem;font-family:var(--mono);font-size:.65rem
}
.audit-ts{color:var(--text3)}
.audit-user{color:var(--accent)}
.audit-event{color:var(--text2)}
.audit-ip{color:var(--text3);font-size:.58rem}

.event-ok    {color:var(--green)}
.event-fail  {color:var(--red)}
.event-admin {color:var(--amber)}
.event-reg   {color:var(--purple)}

.foot{font-family:var(--mono);font-size:.62rem;color:var(--text3);text-align:center;margin-top:1.4rem}
.foot span{color:var(--accent)}

.admin-shell{width:100%;max-width:860px}
</style>
</head>
<body>

<div class="shell" id="auth-shell">
  <div class="brand">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="3.5" fill="#00d4ff"/>
        <circle cx="11" cy="11" r="7" stroke="#00d4ff" stroke-width="1" opacity=".4"/>
        <circle cx="11" cy="11" r="10.2" stroke="#00d4ff" stroke-width=".6" opacity=".18"/>
        <line x1="11" y1="0" x2="11" y2="4.5" stroke="#00d4ff" stroke-width="1.2"/>
        <line x1="11" y1="17.5" x2="11" y2="22" stroke="#00d4ff" stroke-width="1.2"/>
        <line x1="0" y1="11" x2="4.5" y2="11" stroke="#00d4ff" stroke-width="1.2"/>
        <line x1="17.5" y1="11" x2="22" y2="11" stroke="#00d4ff" stroke-width="1.2"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">Open Intelligence Lab</div>
      <div class="brand-sub">Secure Access Portal · v0.7</div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="flash" class="flash"></div>

    <div id="panel-login" class="panel active">
      <div class="field"><label>Username</label>
        <input id="l-user" type="text" placeholder="username" autocomplete="username"/>
      </div>
      <div class="field"><label>Password</label>
        <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn" id="btn-login" onclick="doLogin()">Sign In</button>
    </div>

    <div id="panel-register" class="panel">
      <div class="field"><label>Full Name</label>
        <input id="r-name" type="text" placeholder="First Last" autocomplete="name"/>
      </div>
      <div class="field"><label>Username</label>
        <input id="r-user" type="text" placeholder="lowercase, no spaces" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Password <span style="color:var(--text3);font-size:.58rem;letter-spacing:0">min 8 chars</span></label>
        <input id="r-pass" type="password" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="btn" id="btn-register" onclick="doRegister()">Create Account</button>
    </div>

    <div id="identity">
      <div class="id-top">
        <div class="avatar" id="id-avatar">?</div>
        <div>
          <div class="id-name" id="id-name">—</div>
          <div class="id-sub" id="id-sub">—</div>
        </div>
      </div>

      <div class="grid2">
        <div class="cell">
          <div class="cell-label">Username</div>
          <div class="cell-value accent" id="id-username">—</div>
        </div>
        <div class="cell">
          <div class="cell-label">Role</div>
          <div class="cell-value" id="id-role">—</div>
        </div>
        <div class="cell">
          <div class="cell-label">Last Login</div>
          <div class="cell-value green" id="id-last-login">—</div>
        </div>
        <div class="cell">
          <div class="cell-label">Last Login IP</div>
          <div class="cell-value" id="id-last-ip">—</div>
        </div>
        <div class="cell">
          <div class="cell-label">Session Expires</div>
          <div class="cell-value green" id="id-exp">—</div>
        </div>
        <div class="cell">
          <div class="cell-label">Member Since</div>
          <div class="cell-value" id="id-since">—</div>
        </div>
      </div>

      <div class="token-box">
        <div class="token-box-head">
          <span class="token-label">Bearer Token</span>
          <button class="copy-btn" onclick="copyToken()">Copy</button>
        </div>
        <div class="token-val" id="id-token">—</div>
      </div>

      <div style="display:flex;gap:.6rem;align-items:center">
        <a href="/index.html" style="flex:1">
          <button class="btn sm" style="width:100%">→ Open Dashboard</button>
        </a>
        <button id="btn-admin" class="btn sm amber" onclick="openAdmin()" style="display:none">Admin Panel</button>
        <button class="btn danger-sm" onclick="doLogout()">Sign Out</button>
      </div>
    </div>
  </div>

  <div class="foot">API: <span id="foot-api">—</span></div>
</div>

<div class="shell admin-shell" id="admin-shell" style="display:none">
  <div class="brand">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="3.5" fill="#f5a623"/>
        <circle cx="11" cy="11" r="7" stroke="#f5a623" stroke-width="1" opacity=".4"/>
        <circle cx="11" cy="11" r="10.2" stroke="#f5a623" stroke-width=".6" opacity=".18"/>
      </svg>
    </div>
    <div>
      <div class="brand-name" style="color:var(--amber)">Admin Panel</div>
      <div class="brand-sub">User Management · Audit Log</div>
    </div>
    <div style="margin-left:auto">
      <button class="btn danger-sm" onclick="closeAdmin()">← Back</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:1rem">
    <div class="section-title">Registered Users</div>
    <div id="flash-admin" class="flash"></div>

      <thead>
        <tr>
          <th>Full Name</th><th>Username</th><th>Role</th>
          <th>Last Login</th><th>Last IP</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="section-title">Audit Log <span style="color:var(--text3);font-weight:400">(last 100 events)</span></div>
    <div class="audit-list" id="audit-list"></div>
  </div>
</div>

<script>
// ── API URL — auto-detects local dev vs production ────────────────────────────
const h = window.location.hostname;
const isLocal = h === 'localhost' || h === '127.0.0.1';
const API = isLocal
  ? `${window.location.protocol}//${h}:${window.location.port || 8000}`
  : 'https://open-intelligence-lab-cyrmjw.fly.dev';

document.getElementById('foot-api').textContent = API;

// ── STATE ─────────────────────────────────────────────────────────────────────
let _token  = localStorage.getItem('oil_token') || '';
let _claims = null;
let _profile = null;

// ── HELPERS ───────────────────────────────────────────────────────────────────

function parseJWT(t) {
  try {
    const p = t.split('.')[1];
    const pad = p + '==='.slice((p.length + 3) % 4);
    return JSON.parse(atob(pad.replace(/-/g,'+').replace(/_/g,'/')));
  } catch { return null; }
}

function fmt(unix) {
  if (!unix) return '—';
  return new Date(unix * 1000).toLocaleString([], {
    month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function tokenPreview(t) {
  const p = t.split('.');
  return `<span>${p[0].slice(0,14)}…</span>.<span>${p[1].slice(0,18)}…</span>.${p[2].slice(0,14)}…`;
}

function flash(msg, type='err', adminPanel=false) {
  const el = document.getElementById(adminPanel ? 'flash-admin' : 'flash');
  el.textContent = msg;
  el.className = `flash ${type} show`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 5000);
}

function setLoading(id, on) {
  const b = document.getElementById(id);
  if (on) { b._h = b.innerHTML; b.innerHTML = '<span class="spin"></span>Working…'; b.disabled = true; }
  else     { b.innerHTML = b._h || b.textContent; b.disabled = false; }
}

async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (_token) headers['Authorization'] = `Bearer ${_token}`;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

// ── TABS ──────────────────────────────────────────────────────────────────────

function switchTab(tab) {
  ['login','register'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
  });
  document.getElementById('flash').classList.remove('show');
}

// ── IDENTITY ──────────────────────────────────────────────────────────────────

function showIdentity(token, profile) {
  _claims = parseJWT(token);
  _profile = profile;
  if (!_claims) { doLogout(); return; }

  const name = profile?.full_name || _claims.name || _claims.sub;
  const role = _claims.role || 'analyst';

  document.getElementById('id-avatar').textContent   = initials(name);
  document.getElementById('id-name').textContent     = name;
  document.getElementById('id-sub').textContent      = `${role.toUpperCase()} · OIL Platform`;
  document.getElementById('id-username').textContent = _claims.sub;
  document.getElementById('id-role').innerHTML       = `<span class="badge ${role}">${role}</span>`;
  document.getElementById('id-last-login').textContent = fmt(profile?.last_login);
  document.getElementById('id-last-ip').textContent  = profile?.last_login_ip || '—';
  document.getElementById('id-exp').textContent      = fmt(_claims.exp);
  document.getElementById('id-since').textContent    = fmt(profile?.created);
  document.getElementById('id-token').innerHTML      = tokenPreview(token);
  document.getElementById('btn-admin').style.display = role === 'admin' ? '' : 'none';

  document.getElementById('panel-login').classList.remove('active');
  document.getElementById('panel-register').classList.remove('active');
  document.querySelector('.tabs').style.display = 'none';
  document.getElementById('identity').classList.add('on');
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────

async function doLogin() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value;
  if (!username || !password) { flash('Username and password required.'); return; }

  setLoading('btn-login', true);
  try {
    const data    = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify({ username, password }) });
    _token        = data.access_token;
    localStorage.setItem('oil_token', _token);
    const profile = await apiFetch('/auth/me');
    showIdentity(_token, profile);
  } catch(e) {
    flash(e.message);
  } finally {
    setLoading('btn-login', false);
  }
}

// ── REGISTER ──────────────────────────────────────────────────────────────────

async function doRegister() {
  const full_name = document.getElementById('r-name').value.trim();
  const username  = document.getElementById('r-user').value.trim().toLowerCase();
  const password  = document.getElementById('r-pass').value;

  if (!full_name)          { flash('Full name is required.'); return; }
  if (!username)           { flash('Username is required.'); return; }
  if (password.length < 8) { flash('Password must be at least 8 characters.'); return; }

  setLoading('btn-register', true);
  try {
    await apiFetch('/auth/register', { method:'POST', body: JSON.stringify({ username, password, full_name }) });
    const loginData = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify({ username, password }) });
    _token = loginData.access_token;
    localStorage.setItem('oil_token', _token);
    const profile = await apiFetch('/auth/me');
    showIdentity(_token, profile);
    flash('Account created and signed in.', 'ok');
  } catch(e) {
    flash(e.message);
  } finally {
    setLoading('btn-register', false);
  }
}

// ── LOGOUT ────────────────────────────────────────────────────────────────────

async function doLogout() {
  try { await apiFetch('/auth/logout', { method:'POST' }); } catch {}
  localStorage.removeItem('oil_token');
  _token = ''; _claims = null; _profile = null;
  document.getElementById('identity').classList.remove('on');
  document.querySelector('.tabs').style.display = '';
  switchTab('login');
  closeAdmin();
}

function copyToken() {
  navigator.clipboard.writeText(_token).then(() => {
    const b = document.querySelector('.copy-btn');
    const o = b.textContent; b.textContent = 'Copied ✓';
    setTimeout(() => b.textContent = o, 1500);
  });
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────

async function openAdmin() {
  document.getElementById('auth-shell').style.display  = 'none';
  document.getElementById('admin-shell').style.display = '';
  await loadAdminData();
}

function closeAdmin() {
  document.getElementById('admin-shell').style.display = 'none';
  document.getElementById('auth-shell').style.display  = '';
}

async function loadAdminData() {
  try {
    const [usersRes, auditRes] = await Promise.all([
      apiFetch('/auth/users'),
      apiFetch('/auth/audit?limit=100'),
    ]);
    renderUsers(usersRes.users);
    renderAudit(auditRes.events);
  } catch(e) {
    flash(e.message, 'err', true);
  }
}

function renderUsers(users) {
  document.getElementById('users-tbody').innerHTML = users.map(u => {
    const statusHtml = u.locked
      ? `<span class="locked-badge">Locked</span>`
      : `<span class="ok-badge">Active</span>`;
    const actions = `
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <select id="role-${u.username}" style="font-family:var(--mono);font-size:.65rem;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:.2rem .4rem;border-radius:3px">
          <option value="analyst" ${u.role==='analyst'?'selected':''}>analyst</option>
          <option value="admin"   ${u.role==='admin'  ?'selected':''}>admin</option>
        </select>
        <button class="btn sm" style="font-size:.65rem;padding:.28rem .6rem" onclick="promoteUser('${u.username}')">Set</button>
        ${u.locked ? `<button class="btn danger-sm" onclick="unlockUser('${u.username}')">Unlock</button>` : ''}
      </div>`;
    return `<tr>
      <td style="font-weight:500">${u.full_name||'—'}</td>
      <td style="font-family:var(--mono);font-size:.75rem;color:var(--accent)">${u.username}</td>
      <td><span class="badge ${u.role}">${u.role}</span></td>
      <td style="font-family:var(--mono);font-size:.7rem;color:var(--text2)">${fmt(u.last_login)}</td>
      <td style="font-family:var(--mono);font-size:.68rem;color:var(--text3)">${u.last_login_ip||'—'}</td>
      <td>${statusHtml}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

function renderAudit(events) {
  const colorMap = {
    login_ok:'event-ok', login_fail:'event-fail', login_fail_unknown:'event-fail',
    login_blocked:'event-fail', register:'event-reg',
    role_change:'event-admin', unlock:'event-admin', logout:'event-ok',
  };
  document.getElementById('audit-list').innerHTML = events.map(e => {
    const cls = colorMap[e.event] || '';
    return `<div class="audit-row">
      <span class="audit-ts">${fmt(e.ts)}</span>
      <span class="audit-user">${e.username}</span>
      <span class="audit-event ${cls}">${e.event}${e.detail?' · '+e.detail:''}</span>
      <span class="audit-ip">${e.ip||''}</span>
    </div>`;
  }).join('');
}

async function promoteUser(username) {
  const role = document.getElementById('role-' + username).value;
  try {
    await apiFetch('/auth/promote', { method:'POST', body: JSON.stringify({ username, role }) });
    flash(`${username} is now ${role}`, 'ok', true);
    await loadAdminData();
  } catch(e) { flash(e.message, 'err', true); }
}

async function unlockUser(username) {
  try {
    await apiFetch('/auth/unlock', { method:'POST', body: JSON.stringify({ username }) });
    flash(`${username} unlocked`, 'ok', true);
    await loadAdminData();
  } catch(e) { flash(e.message, 'err', true); }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('panel-login').classList.contains('active'))         doLogin();
  else if (document.getElementById('panel-register').classList.contains('active')) doRegister();
});

// ── SESSION RESTORE ───────────────────────────────────────────────────────────
(async function init() {
  if (!_token) return;
  const c = parseJWT(_token);
  if (!c || c.exp < Date.now() / 1000) {
    localStorage.removeItem('oil_token'); _token = ''; return;
  }
  try {
    const profile = await apiFetch('/auth/me');
    showIdentity(_token, profile);
  } catch {
    localStorage.removeItem('oil_token'); _token = '';
  }
})();
</script>
