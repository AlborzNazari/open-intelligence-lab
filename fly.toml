# fly.toml — Open Intelligence Lab v0.7.0
# https://fly.io/docs/reference/configuration/

app = 'open-intelligence-lab-cyrmjw'
primary_region = 'ams'

[build]
  [build.args]
    VERSION = "v7.2.0"

[env]
  PYTHONPATH            = "/app"
  MISP_LABEL            = "MISP-Live"
  MISP_PULL_DAYS        = "7"
  MISP_LIMIT            = "200"
  MISP_VERIFY_SSL       = "true"
  MISP_INTERVAL_SECONDS = "3600"
  OIL_USER_DB           = "/data/oil_users.db"

[mounts]
  source      = "oil_data"
  destination = "/data"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = 'stop'
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ['app']

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  interval     = "15s"
  timeout      = "10s"
  grace_period = "30s"
  method       = "GET"
  path         = "/health"

[[vm]]
  memory   = '512mb'
  cpu_kind = 'shared'
  cpus     = 1
